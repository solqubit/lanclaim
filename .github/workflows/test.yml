name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: for f in lanclaim/static/js/*.js; do node --check "$f"; done
      - run: node tests/test_model.mjs && node tests/test_i18n.mjs && node tests/test_autosave.mjs && node tests/test_drafts.mjs && node tests/test_api.mjs
      - run: bash -n install.sh update.sh uninstall.sh scripts/common.sh
      - run: shellcheck -x -e SC1091 install.sh update.sh uninstall.sh scripts/common.sh tests/linux/lifecycle.sh
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tests/linux/Dockerfile -t lanclaim-lifecycle:test .
      - run: docker run --rm lanclaim-lifecycle:test
      - run: docker run --rm --sysctl 'net.ipv4.ping_group_range=1 0' lanclaim-lifecycle:test
