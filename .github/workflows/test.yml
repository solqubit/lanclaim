name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: node --check lanclaim/static/app.js && node --check lanclaim/static/i18n.js
      - run: node tests/test_i18n.cjs
      - run: bash -n install.sh update.sh uninstall.sh scripts/common.sh
      - run: shellcheck -x -e SC1091 install.sh update.sh uninstall.sh scripts/common.sh tests/linux/lifecycle.sh
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tests/linux/Dockerfile -t lanclaim-lifecycle:test .
      - run: docker run --rm lanclaim-lifecycle:test
