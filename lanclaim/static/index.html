<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121418" />
    <title>Mi espacio de IPs · LanClaim</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/i18n.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="#network"
        ><img src="/favicon.svg" alt="" width="26" height="26" />LanClaim</a
      >
      <nav aria-label="Navegación principal">
        <button data-nav="network" class="nav-item active">Red</button>
        <button data-nav="ips" class="nav-item">
          Mis IPs <b id="nav-count">0</b>
        </button>
        <button data-nav="machines" class="nav-item">Máquinas</button>
      </nav>
      <div class="topbar-controls">
        <select id="language" aria-label="Idioma">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
        <button class="quiet" id="refresh" aria-label="Actualizar">↻</button>
      </div>
    </header>
    <main>
      <div id="global-error" role="alert" hidden></div>
      <header class="page-heading">
        <div>
          <h1 id="page-title">Mi red</h1>
          <p id="page-subtitle">Escanea, revisa y reclama tus direcciones.</p>
        </div>
        <div class="header-actions">
          <button class="secondary" id="claim">＋ Reclamar IPs</button>
        </div>
      </header>
      <section
        id="stats"
        class="stats"
        hidden
        aria-label="Resumen del inventario"
      ></section>
      <div id="workspace-layout" class="workspace-layout">
        <div id="content">
          <div class="empty">Cargando tu espacio…</div>
        </div>
        <aside
          id="inspector"
          class="inspector"
          hidden
          aria-labelledby="inspector-title"
        >
          <div class="inspector-heading">
            <button
              class="quiet inspector-back"
              id="inspector-back"
              type="button"
              hidden
            >
              ← Volver
            </button>
            <div>
              <h2 id="inspector-title" tabindex="-1"></h2>
            </div>
            <button
              type="button"
              class="icon-button"
              id="close-inspector"
              aria-label="Cerrar detalles"
            >
              ×
            </button>
          </div>
          <div id="inspector-body"></div>
        </aside>
      </div>
      <footer>
        <span>Una IP sin respuesta no significa que esté disponible.</span
        ><span id="version">v0.1.0</span>
      </footer>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
